name: ASP.NET Core

on:
  push:
    branches: ["main", "dev*"]
    tags: ["*.*.*"]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # runs-on: [macos-11, ubuntu-22.04, windows-latest]
        runs-on: [ubuntu-latest, windows-latest]
    name: ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup .NET 10.0.x, 9.0.x, and 8.0.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Setup .NET 11.0.x Preview
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: "preview"

      - name: dotnet info
        run: dotnet --info

      - name: Install dotnet tool
        run: dotnet tool restore

      - name: MinVer
        shell: pwsh
        id: minver
        run: Write-Output "version=$(dotnet minver)" | Out-File -FilePath $Env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set Docker tag suffix
        if: ${{ success() && (runner.os == 'Linux' || runner.os == 'Windows') }}
        shell: pwsh
        run: |
          $tagSuffix = if ($Env:RUNNER_OS -eq 'Linux') { '-alpine' } else { if ($Env:RUNNER_OS -eq 'Windows') { '-nanoserver-1809' } }
          Write-Output "TAG_SUFFIX=$tagSuffix" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Set tag suffix to: $tagSuffix"

      - name: Docker meta 8.0
        if: ${{ success() && (runner.os == 'Linux' || runner.os == 'Windows') }}
        id: meta80
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKER_HUB_REPOS }}
            netlah/echo-service-api,enable=${{ startsWith(github.ref, 'refs/tags/') }}
          flavor: |
            latest=auto
            suffix=${{ env.TAG_SUFFIX }}
            prefix=8.0-
          tags: |
            type=raw,enable=${{ github.event_name != 'pull_request' }},priority=699,value=${{ steps.minver.outputs.version }}
            type=ref,event=branch,priority=500
            type=ref,event=pr,priority=500,prefix=8.0-pr-
            type=sha,enable=${{ github.event_name != 'pull_request' }},priority=400,prefix=8.0-sha-,format=short
            type=match,enable=${{ startsWith(github.ref, 'refs/tags/') }},priority=600,pattern=^(\d+\.\d+(\.\d+)?(-.+)?)$,group=1
            type=match,enable=${{ startsWith(github.ref, 'refs/tags/') }},priority=580,pattern=^(\d+\.\d+(\.\d+)?)(-.+)?$,group=1
            type=match,enable=${{ startsWith(github.ref, 'refs/tags/') }},priority=570,pattern=^(\d+\.\d+)(\.\d+)?(-.+)?$,group=1
            type=match,enable=${{ startsWith(github.ref, 'refs/tags/') }},priority=560,pattern=^(\d+)\.\d+(\.\d+)?(-.+)?$,group=1

      - name: Docker meta 9.0
        if: ${{ success() && (runner.os == 'Linux' || runner.os == 'Windows') }}
        id: meta90
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKER_HUB_REPOS }}
            netlah/echo-service-api,enable=${{ startsWith(github.ref, 'refs/tags/') }}
          flavor: |
            latest=auto
            suffix=${{ env.TAG_SUFFIX }}
            prefix=9.0-
          tags: |
            type=raw,enable=${{ github.event_name != 'pull_request' }},priority=699,value=${{ steps.minver.outputs.version }}
            type=ref,event=branch,priority=500
            type=ref,event=pr,priority=500,prefix=9.0-pr-
            type=sha,enable=${{ github.event_name != 'pull_request' }},priority=400,prefix=9.0-sha-,format=short
            type=match,enable=${{ startsWith(github.ref, 'refs/tags/') }},priority=600,pattern=^(\d+\.\d+(\.\d+)?(-.+)?)$,group=1
            type=match,enable=${{ startsWith(github.ref, 'refs/tags/') }},priority=590,pattern=^(\d+\.\d+(\.\d+)?)(-.+)?$,group=1
            type=match,enable=${{ startsWith(github.ref, 'refs/tags/') }},priority=570,pattern=^(\d+\.\d+)(\.\d+)?(-.+)?$,group=1
            type=match,enable=${{ startsWith(github.ref, 'refs/tags/') }},priority=560,pattern=^(\d+)\.\d+(\.\d+)?(-.+)?$,group=1

      - name: Docker meta 10.0
        if: ${{ success() && (runner.os == 'Linux' || runner.os == 'Windows') }}
        id: meta100
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKER_HUB_REPOS }}
            netlah/echo-service-api,enable=${{ startsWith(github.ref, 'refs/tags/') }}
          flavor: |
            latest=auto
            suffix=${{ env.TAG_SUFFIX }}
          tags: |
            type=raw,enable=${{ github.event_name != 'pull_request' }},priority=999,value=${{ steps.minver.outputs.version }}
            type=match,enable=${{ startsWith(github.ref, 'refs/tags/') }},priority=900,pattern=^(\d+\.\d+(\.\d+)?(-.+)?)$,group=1
            type=match,enable=${{ startsWith(github.ref, 'refs/tags/') }},priority=880,pattern=^(\d+\.\d+(\.\d+)?)(-.+)?$,group=1
            type=match,enable=${{ startsWith(github.ref, 'refs/tags/') }},priority=870,pattern=^(\d+\.\d+)(\.\d+)?(-.+)?$,group=1
            type=match,enable=${{ startsWith(github.ref, 'refs/tags/') }},priority=860,pattern=^(\d+)\.\d+(\.\d+)?(-.+)?$,group=1
            type=raw,enable=${{ github.event_name != 'pull_request' }},priority=699,prefix=10.0-,value=${{ steps.minver.outputs.version }}
            type=ref,event=branch,priority=500,prefix=10.0-
            type=ref,event=pr,priority=500,prefix=10.0-pr-
            type=sha,enable=${{ github.event_name != 'pull_request' }},priority=400,prefix=10.0-sha-,format=short
            type=match,enable=${{ startsWith(github.ref, 'refs/tags/') }},priority=600,prefix=10.0-,pattern=^(\d+\.\d+(\.\d+)?(-.+)?)$,group=1
            type=match,enable=${{ startsWith(github.ref, 'refs/tags/') }},priority=580,prefix=10.0-,pattern=^(\d+\.\d+(\.\d+)?)(-.+)?$,group=1
            type=match,enable=${{ startsWith(github.ref, 'refs/tags/') }},priority=570,prefix=10.0-,pattern=^(\d+\.\d+)(\.\d+)?(-.+)?$,group=1
            type=match,enable=${{ startsWith(github.ref, 'refs/tags/') }},priority=560,prefix=10.0-,pattern=^(\d+)\.\d+(\.\d+)?(-.+)?$,group=1

      - name: Docker meta 11.0
        if: ${{ success() && (runner.os == 'Linux' || runner.os == 'Windows') }}
        id: meta110
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKER_HUB_REPOS }}
            netlah/echo-service-api,enable=${{ startsWith(github.ref, 'refs/tags/') }}
          flavor: |
            latest=auto
            suffix=${{ env.TAG_SUFFIX }}
            prefix=11.0-
          tags: |
            type=raw,enable=${{ github.event_name != 'pull_request' }},priority=699,value=${{ steps.minver.outputs.version }}
            type=ref,event=branch,priority=500
            type=ref,event=pr,priority=500,prefix=11.0-pr-
            type=sha,enable=${{ github.event_name != 'pull_request' }},priority=400,prefix=11.0-sha-,format=short
            type=match,enable=${{ startsWith(github.ref, 'refs/tags/') }},priority=600,pattern=^(\d+\.\d+(\.\d+)?(-.+)?)$,group=1
            type=match,enable=${{ startsWith(github.ref, 'refs/tags/') }},priority=580,pattern=^(\d+\.\d+(\.\d+)?)(-.+)?$,group=1
            type=match,enable=${{ startsWith(github.ref, 'refs/tags/') }},priority=570,pattern=^(\d+\.\d+)(\.\d+)?(-.+)?$,group=1
            type=match,enable=${{ startsWith(github.ref, 'refs/tags/') }},priority=560,pattern=^(\d+)\.\d+(\.\d+)?(-.+)?$,group=1

      - name: Install dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

      - name: Publish
        shell: pwsh
        run: |
          foreach ($framework in @('net8.0', 'net9.0', 'net10.0', 'net11.0')) {
            dotnet publish EchoServiceApi -c Release -f $framework --no-build -o "artifacts/$($framework)/app"
          }

      - name: Copy Dockerfile
        if: ${{ success() && (runner.os == 'Linux' || runner.os == 'Windows') }}
        shell: pwsh
        run: |
          foreach ($framework in @('net8.0', 'net9.0', 'net10.0', 'net11.0')) {
            Copy-Item -Recurse -Force -Path '.dockerignore',".docker-$( if ($Env:RUNNER_OS -eq 'Linux') { 'linux' } else { 'windows' } )/*" -Destination "artifacts/$($framework)/" -ErrorAction Stop -Verbose
          }

      - name: Enabling Docker Daemon With experimental features
        if: ${{ success() && runner.os == 'Linux' }}
        shell: pwsh
        run: |
          if(Test-Path /etc/docker/daemon.json -PathType Leaf -ErrorAction SilentlyContinue) {
            echo 'Before update daemon.json'
            sudo cat /etc/docker/daemon.json
            sudo bash -c 'echo "{ "\""exec-opts"\"": ["\""native.cgroupdriver=cgroupfs"\""], "\""cgroup-parent"\"": "\""/actions_job"\"", "\""experimental"\"": true }" > /etc/docker/daemon.json'
          } else {
            sudo bash -c 'echo "{ "\""experimental"\"": true }" > /etc/docker/daemon.json'
          }
          echo 'After update daemon.json'
          sudo cat /etc/docker/daemon.json
          sudo systemctl restart docker.service

      - name: Set up Docker Buildx
        if: ${{ success() && (runner.os == 'Linux') }}
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: ${{ success() && (runner.os == 'Linux' || runner.os == 'Windows') }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and Push 8.0
        if: ${{ success() && (runner.os == 'Linux' || runner.os == 'Windows') }}
        shell: pwsh
        run: |
          $aspnetImageTag80 = if ($Env:RUNNER_OS -eq 'Linux') { '8.0-alpine' } else { '8.0-nanoserver-1809' }
          ./docker-build.ps1 -Context ./artifacts/net8.0 -Squash -Tags "${{ steps.meta80.outputs.tags }}" -Labels "${{ steps.meta80.outputs.labels }}" -BuildArgs "ASPNET_IMAGE_TAG=$aspnetImageTag80"

      - name: Build and Push 9.0
        if: ${{ success() && (runner.os == 'Linux' || runner.os == 'Windows') }}
        shell: pwsh
        run: |
          $aspnetImageTag90 = if ($Env:RUNNER_OS -eq 'Linux') { '9.0-alpine' } else { '9.0-nanoserver-1809' }
          ./docker-build.ps1 -Context ./artifacts/net9.0 -Squash -Tags "${{ steps.meta90.outputs.tags }}" -Labels "${{ steps.meta90.outputs.labels }}" -BuildArgs "ASPNET_IMAGE_TAG=$aspnetImageTag90"

      - name: Build and Push 10.0
        if: ${{ success() && (runner.os == 'Linux' || runner.os == 'Windows') }}
        shell: pwsh
        run: |
          $aspnetImageTag100 = if ($Env:RUNNER_OS -eq 'Linux') { '10.0-alpine' } else { '10.0-nanoserver-1809' }
          $aspnetImageRepo100 = if ($Env:RUNNER_OS -eq 'Linux') { 'netlah/aspnet-webssh' } else { 'netlah/dotnet-aspnet' }
          ./docker-build.ps1 -Context ./artifacts/net10.0 -Squash -Tags "${{ steps.meta100.outputs.tags }}" -Labels "${{ steps.meta100.outputs.labels }}" -BuildArgs "ASPNET_IMAGE_TAG=$aspnetImageTag100`nASPNET_IMAGE_REPO=$aspnetImageRepo100"

      - name: Build and Push 11.0
        if: ${{ success() && (runner.os == 'Linux') }}
        # if: ${{ success() && (runner.os == 'Linux' || runner.os == 'Windows') }}
        shell: pwsh
        run: |
          $aspnetImageTag110 = if ($Env:RUNNER_OS -eq 'Linux') { '11.0-alpine' } else { '11.0-nanoserver-1809' }
          ./docker-build.ps1 -Context ./artifacts/net11.0 -Squash -Tags "${{ steps.meta110.outputs.tags }}" -Labels "${{ steps.meta110.outputs.labels }}" -BuildArgs "ASPNET_IMAGE_TAG=$aspnetImageTag110"
